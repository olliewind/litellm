stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # PROXY_EXTRAS_SOURCE=local bakes in this repo's litellm-proxy-extras (the broker
    # Prisma migration); the default `published` pulls from PyPI and drops the migration.
    - docker build -f docker/Dockerfile.non_root --build-arg PROXY_EXTRAS_SOURCE=local -t "$CI_REGISTRY_IMAGE:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"

# RELEASE: pushing a git tag auto-builds  registry/.../litellm:<tag>
release-image:
  extends: .build
  variables:
    TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG

# DEV: a merge request event builds registry/.../litellm:<commit_hash>-<branch-slug>
dev-image:
  extends: .build
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - !reference [.build, before_script]
    - apk add --no-cache curl jq
  script:
    # 1. Post a placeholder comment and extract the note ID
    - 'NOTE_RESPONSE=$(curl -s --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --header "Content-Type: application/json" "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" --data "{\"body\": \"⏳ Building Container Image...\"}")'
    - 'NOTE_ID=$(echo $NOTE_RESPONSE | jq -r ".id")'
    - echo "Created note with ID $NOTE_ID"
    # 2. Build and push the image
    - docker build -f docker/Dockerfile.non_root --build-arg PROXY_EXTRAS_SOURCE=local -t "$CI_REGISTRY_IMAGE:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    # 3. Update the comment with the final URL
    - 'if [ "$NOTE_ID" != "null" ] && [ -n "$NOTE_ID" ]; then curl -s --request PUT --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --header "Content-Type: application/json" "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes/$NOTE_ID" --data "{\"body\": \"✅ Container Image built. Available at URL: \`$CI_REGISTRY_IMAGE:$TAG\`\"}"; else echo "Failed to create or update note. Please ensure GITLAB_TOKEN is set with api scope."; fi'
