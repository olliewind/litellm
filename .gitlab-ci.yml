stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # PROXY_EXTRAS_SOURCE=local bakes in this repo's litellm-proxy-extras (the broker
    # Prisma migration); the default `published` pulls from PyPI and drops the migration.
    - docker build -f docker/Dockerfile.non_root --build-arg PROXY_EXTRAS_SOURCE=local -t "$CI_REGISTRY_IMAGE:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"

# RELEASE: pushing a git tag auto-builds  registry/.../litellm:<tag>
release-image:
  extends: .build
  variables:
    TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG

# DEV: a branch push creates a pipeline with a manual ▶ button (no build until you
# click it); builds  registry/.../litellm:<branch-slug>
dev-image:
  extends: .build
  variables:
    TAG: $CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
