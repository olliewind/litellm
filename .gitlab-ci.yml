stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"

.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # PROXY_EXTRAS_SOURCE=local bakes in this repo's litellm-proxy-extras (the broker
    # Prisma migration); the default `published` pulls from PyPI and drops the migration.
    - docker build -f docker/Dockerfile.non_root --build-arg PROXY_EXTRAS_SOURCE=local -t "$CI_REGISTRY_IMAGE:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"

# RELEASE: pushing a git tag auto-builds  registry/.../litellm:<tag>
release-image:
  extends: .build
  variables:
    TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG

# DEV: a merge request event builds registry/.../litellm:<commit_hash>-<branch-slug>
dev-image:
  extends: .build
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - !reference [.build, before_script]
    - apk add --no-cache curl
  script:
    - docker build -f docker/Dockerfile.non_root --build-arg PROXY_EXTRAS_SOURCE=local -t "$CI_REGISTRY_IMAGE:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - 'curl --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" --data-urlencode "body=Container Image built. Available at URL: $CI_REGISTRY_IMAGE:$TAG"'
